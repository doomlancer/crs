services:
  app:
    # Fertiges Image aus der GitHub-Registry. Es wird bei jedem Push auf main
    # automatisch von GitHub Actions gebaut (.github/workflows/docker-publish.yml).
    # Lokal selbst bauen? -> docker-compose.build.yml zusätzlich laden, siehe README.
    image: ${APP_IMAGE:-ghcr.io/doomlancer/crs:latest}
    container_name: kameruner-tickets
    restart: unless-stopped
    labels:
      # Nur Container mit diesem Label werden von Watchtower aktualisiert.
      # Dadurch bleiben MariaDB und alle übrigen Unraid-Container unangetastet.
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Host-Port : Container-Port. Auf Unraid z.B. 8080 wählen und dann
      # den Reverse-Proxy oder den Browser auf http://SERVER-IP:8080 zeigen.
      - "${APP_PORT:-8080}:80"
    environment:
      # ── Datenbank (zeigt auf den db-Service unten) ──
      DB_HOST: db
      DB_NAME: ${DB_NAME:-crs}
      DB_USER: ${DB_USER:-crs}
      DB_PASS: ${DB_PASS:-changeme}
      # ── Anwendung ──
      APP_NAME: ${APP_NAME:-Kameruner-Tickets}
      APP_URL: ${APP_URL:-http://localhost:8080}
      TICKET_PREIS: ${TICKET_PREIS:-15.00}
      DEBUG_MODE: ${DEBUG_MODE:-false}
      # FORCE_HTTPS=false für lokalen HTTP-Zugriff; true hinter Reverse-Proxy/TLS
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      # ── Erst-Admin (nur beim ersten Start verwendet) ──
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_VORNAME: ${ADMIN_VORNAME:-Admin}
      ADMIN_NACHNAME: ${ADMIN_NACHNAME:-Kameruner}
      # ── PayPal (optional) ──
      PAYPAL_EMAIL: ${PAYPAL_EMAIL:-}
      PAYPAL_SANDBOX: ${PAYPAL_SANDBOX:-false}
      # ── SMTP / E-Mail (optional – leer lassen = kein Mailversand) ──
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-on}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Kameruner-Tickets}
    volumes:
      - app_uploads:/var/www/html/uploads
      - app_logs:/var/www/html/logs

  db:
    image: mariadb:10.11
    container_name: kameruner-tickets-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-crs}
      MARIADB_USER: ${DB_USER:-crs}
      MARIADB_PASSWORD: ${DB_PASS:-changeme}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-changeme-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # Meldet den Container erst als "healthy", wenn MariaDB Verbindungen
      # annimmt und InnoDB fertig initialisiert ist. Der app-Container startet
      # erst danach (siehe depends_on/condition oben).
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ── Automatische Updates ────────────────────────────────────────────────
  # Prüft regelmäßig, ob in der Registry ein neueres App-Image liegt, und
  # startet den Container dann mit der neuen Version neu. Dadurch landet jede
  # Änderung ohne Eingriff auf dem Server im laufenden Betrieb.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: kameruner-tickets-watchtower
    restart: unless-stopped
    volumes:
      # Zugriff auf die Docker-Steuerung, um Container zu erneuern
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # NUR beschriftete Container anfassen (siehe Label beim app-Service).
      # Ohne diesen Schalter würde Watchtower ALLE Container auf dem Unraid
      # aktualisieren – auch fremde Dienste und die Datenbank.
      WATCHTOWER_LABEL_ENABLE: "true"
      # Alte, ersetzte Images aufräumen, damit der Speicher nicht volläuft
      WATCHTOWER_CLEANUP: "true"
      # Beim Neustart abhängige Container korrekt behandeln
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      # Prüfintervall in Sekunden (Standard: alle 5 Minuten).
      # Alternativ nächtlich statt im Takt: WATCHTOWER_SCHEDULE setzen und
      # WATCHTOWER_POLL_INTERVAL leer lassen – siehe README-Docker.md.
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_INTERVAL:-300}
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE:-}
      # Zugangsdaten für die private Registry
      REPO_USER: ${GHCR_USER:-}
      REPO_PASS: ${GHCR_TOKEN:-}
      TZ: ${TZ:-Europe/Berlin}

volumes:
  app_uploads:
  app_logs:
  db_data:
